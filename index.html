<!DOCTYPE html>
<html lang="en" data-persona="adult">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pillo Care+ — Adult &amp; Kid-Friendly Mobile Medication &amp; Heart Companion</title>
  <meta name="description" content="Restyled mobile medication & smartwatch heart rate companion inspired by pillo.care with 3D Pillo characters, Circle Timer countdowns, Worried-to-Angry Kid Mode progression, and Multi-Sensor Dose Guarantee." />
  <meta name="theme-color" content="#16382C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pillo Care+" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.json?v=5" />
  <link rel="stylesheet" href="./styles.css?v=5" />
</head>
<body>
  <div class="workspace-wrapper">
    <!-- Mobile Phone Hardware Frame (Full-bleed edge-to-edge on real mobile devices) -->
    <div class="phone-device" id="phone-device-shell">
      <!-- Top Phone Status Bar & Dynamic Island (Desktop Simulator Frame only; auto-hidden on real mobile devices) -->
      <div class="phone-status-bar">
        <span>9:41</span>
        <div class="dynamic-island" id="dynamic-island">
          <span class="island-dot"></span>
          <span id="dynamic-island-text">00:45</span>
        </div>
        <div class="status-icons">
          <span>5G</span>
          <span>100%</span>
        </div>
      </div>

      <!-- Celebration Toast Banner -->
      <div class="celebration-toast" id="celebration-toast" role="status" aria-live="polite">
        <span id="celebration-toast-text">Dose Guaranteed!</span>
      </div>

      <!-- App Header & Adult / Kid Persona Switcher -->
      <header class="app-header">
        <div class="header-top-row">
          <div class="brand-cluster">
            <div class="brand-logo-badge" id="header-mascot-avatar" aria-hidden="true">P</div>
            <div class="brand-titles">
              <h1 id="app-main-title">Pillo Care+</h1>
              <div class="brand-subtitle" id="app-main-subtitle">The Angry Pill Box • Adult Mode</div>
            </div>
          </div>

          <div class="header-actions">
            <span class="icon-btn streak-chip" id="streak-chip-text">🔥 14d • ❤️ 42</span>
            <button class="icon-btn" id="btn-mobile-install" onclick="openMobileInstallSheet()" type="button" title="Open or install on any mobile phone">
              📲 App
            </button>
            <button class="icon-btn" id="btn-sound-toggle" onclick="toggleSound()" type="button">
              🔊 Sound
            </button>
          </div>
        </div>

        <!-- Seamless Adult vs. Kid Mode Switcher -->
        <div class="persona-switcher" role="tablist" aria-label="Switch between Adult and Kid Mode">
          <button
            id="btn-persona-adult"
            class="persona-btn active"
            type="button"
            onclick="switchPersona('adult')"
          >
            🧑 Adult Mode (Pillo Box)
          </button>
          <button
            id="btn-persona-kid"
            class="persona-btn"
            type="button"
            onclick="switchPersona('kid')"
          >
            🧒 Kid Mode (Worried→Angry)
          </button>
        </div>
      </header>

      <!-- Main Scrollable Mobile Content Area -->
      <main class="phone-main" id="phone-main-content"></main>

      <!-- Bottom Mobile Navigation Bar -->
      <nav class="phone-tab-bar" aria-label="Primary Bottom Navigation">
        <button class="tab-item active" data-tab="today" type="button" onclick="switchTab('today')">
          <span class="tab-icon">⏱️</span>
          <span>Time-Box</span>
        </button>
        <button class="tab-item" data-tab="heart" type="button" onclick="switchTab('heart')">
          <span class="tab-icon">⌚</span>
          <span>Heart Watch</span>
        </button>
        <button class="tab-item" data-tab="log" type="button" onclick="switchTab('log')">
          <span class="tab-icon">🛡️</span>
          <span>Guarantee Log</span>
        </button>
        <button class="tab-item" data-tab="cabinet" type="button" onclick="switchTab('cabinet')">
          <span class="tab-icon">💊</span>
          <span>Med Cabinet</span>
        </button>
      </nav>

      <!-- PERSISTENT LOCKDOWN OVERLAY -->
      <!-- Appears ONLY when the Circle Timer hits 00:00, Critical Refill (<=2 left), Max Snooze, or Critical Watch Heart Rate Alert -->
      <section
        class="angry-lockdown-overlay"
        id="angry-lockdown-overlay"
        role="alertdialog"
        aria-modal="true"
        aria-label="Urgent Medication or Heart Rate Guarantee Required"
      ></section>

      <!-- Bottom Sheet Modal (for On-Time Guarantee, Mobile Install, or Adding Medication) -->
      <div class="sheet-backdrop" id="sheet-backdrop" onclick="closeBottomSheet()">
        <div class="bottom-sheet" id="bottom-sheet-content" onclick="event.stopPropagation()"></div>
      </div>
    </div>
  </div>

  <script src="./assets.js?v=5"></script>
  <script src="./app.js?v=5"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=5').then((reg) => {
          reg.update();
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
